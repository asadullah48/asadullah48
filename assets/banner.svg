<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Asadullah Shafique — Agentic AI Developer, CMT Industry Founder, Digital Marketing Strategist">
  <title>Asadullah Shafique — Agentic AI Developer</title>

  <defs>
    <!-- Midnight Carbon base: hue-220 tinted near-black, not pure #000 -->
    <linearGradient id="base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#08090C"/>
      <stop offset="100%" stop-color="#050506"/>
    </linearGradient>

    <!-- Ambient aurora. Violet is ambient-only, never interactive. -->
    <radialGradient id="auroraCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00F2FF" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#00F2FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="auroraViolet" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>

    <!-- Grid, faded from the centre outward so it never fights the text -->
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#00F2FF" stroke-opacity="0.09" stroke-width="1"/>
    </pattern>
    <radialGradient id="gridFade" cx="50%" cy="50%" r="62%">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#fff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <mask id="gridMask">
      <rect width="1200" height="320" fill="url(#gridFade)"/>
    </mask>

    <!-- Hairline rule: bright at centre, dissolving at both ends -->
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#00F2FF" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#00F2FF" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#00F2FF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="topEdge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#00F2FF" stop-opacity="0"/>
      <stop offset="35%"  stop-color="#00F2FF" stop-opacity="0.55"/>
      <stop offset="65%"  stop-color="#8B5CF6" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- ── substrate ─────────────────────────────────────────────── -->
  <rect width="1200" height="320" fill="url(#base)"/>
  <g mask="url(#gridMask)">
    <rect width="1200" height="320" fill="url(#grid)"/>
  </g>
  <ellipse cx="250" cy="286" rx="470" ry="230" fill="url(#auroraCyan)"/>
  <ellipse cx="1010" cy="44"  rx="420" ry="210" fill="url(#auroraViolet)"/>

  <!-- ── type ──────────────────────────────────────────────────── -->
  <g text-anchor="middle" font-family="'Space Grotesk','Segoe UI',Inter,system-ui,-apple-system,sans-serif">

    <text x="600" y="104" font-family="'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace"
          font-size="13" letter-spacing="4.5" fill="#00F2FF" fill-opacity="0.92">
      AGENTIC AI ENGINEERING
    </text>

    <text x="600" y="180" font-size="66" font-weight="700" letter-spacing="-1.4" fill="#E8ECF1">
      Asadullah Shafique
    </text>

    <rect x="490" y="204" width="220" height="1" fill="url(#rule)"/>

    <text x="600" y="240" font-size="17.5" letter-spacing="0.3" fill="#57DEEB">
      Agentic AI Developer &#183; CMT Industry Founder &#183; Digital Marketing Strategist
    </text>

    <text x="600" y="276" font-family="'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace"
          font-size="12.5" letter-spacing="1.6" fill="#7C8798">
      asadullahshafique-devunity.vercel.app
    </text>
  </g>

  <!-- ── frame ─────────────────────────────────────────────────── -->
  <rect x="0" y="0" width="1200" height="1" fill="url(#topEdge)"/>
  <rect x="0" y="319" width="1200" height="1" fill="#1A1E25"/>
</svg>
