<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 120" width="1200" height="120" role="img" aria-label="Build agents that act">
  <title>Build agents that act, not just respond.</title>

  <defs>
    <linearGradient id="fbase" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#050506"/>
      <stop offset="100%" stop-color="#0B0D10"/>
    </linearGradient>

    <radialGradient id="fglow" cx="50%" cy="100%" r="70%">
      <stop offset="0%" stop-color="#00F2FF" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="#8B5CF6" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="fedge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#00F2FF" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#00F2FF" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#00F2FF" stop-opacity="0"/>
    </linearGradient>

    <pattern id="fgrid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#00F2FF" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <radialGradient id="fgridFade" cx="50%" cy="110%" r="75%">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <mask id="fgridMask">
      <rect width="1200" height="120" fill="url(#fgridFade)"/>
    </mask>
  </defs>

  <rect width="1200" height="120" fill="url(#fbase)"/>
  <g mask="url(#fgridMask)">
    <rect width="1200" height="120" fill="url(#fgrid)"/>
  </g>
  <ellipse cx="600" cy="132" rx="620" ry="120" fill="url(#fglow)"/>

  <rect x="0" y="0" width="1200" height="1" fill="url(#fedge)"/>

  <text x="600" y="62" text-anchor="middle"
        font-family="'Space Grotesk','Segoe UI',Inter,system-ui,-apple-system,sans-serif"
        font-size="19" font-weight="600" letter-spacing="0.2" fill="#E8ECF1">
    Build agents that act &#8212; not just respond.
  </text>

  <text x="600" y="90" text-anchor="middle"
        font-family="'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace"
        font-size="11.5" letter-spacing="2.4" fill="#57DEEB" fill-opacity="0.8">
    SPEC-FIRST &#183; EVIDENCE OVER CONFIDENCE
  </text>
</svg>
